name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_SERVER: ${{ github.repository }}/server
  IMAGE_NAME_CLIENT: ${{ github.repository }}/client

jobs:
  # =========================================================================
  # Stage 1: Automated Testing & Application Build
  # =========================================================================
  test-and-build:
    name: "1. Automated Test & Build"
    runs-on: ubuntu-latest
    steps:
      # (a) Checkout code
      - name: a. Checkout Code
        uses: actions/checkout@v4

      # (b) Set up Runtimes
      - name: b1. Set up Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'server/requirements.txt'

      - name: b2. Set up Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'

      # (c) Install Dependencies with Caching
      - name: c1. Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt pytest pytest-asyncio

      - name: c2. Install Frontend Dependencies
        run: |
          npm --prefix client ci

      # (d) Run Automated Unit Tests
      - name: d1. Run Backend Automated Tests (pytest)
        run: |
          python -m pytest server -v

      - name: d2. Run Frontend Automated Tests (vitest)
        run: |
          npm --prefix client test

      # (e) Build Application
      - name: e. Build Frontend Production Bundle
        run: |
          npm --prefix client run build

  # =========================================================================
  # Stage 2: Docker Containerization, Registry Push & Continuous Deployment
  # =========================================================================
  containerize-and-deploy:
    name: "2. Containerize, Push & Deploy"
    needs: test-and-build
    runs-on: ubuntu-latest
    steps:
      # (a) Checkout code
      - name: a. Checkout Code
        uses: actions/checkout@v4

      # Set up Docker Buildx for multi-platform & cached builds
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # (f) Build Docker Images to prove they build (Runs on every Push and PR)
      - name: f1. Build Server Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          load: true
          tags: stocksense-server:test

      - name: f2. Build Client Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          file: ./client/Dockerfile
          load: true
          tags: stocksense-client:test

      # (g) Push Docker Images to GitHub Container Registry (ghcr.io)
      # Triggered only on push to main/master branches
      - name: g1. Log in to GitHub Container Registry
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: g2. Extract Docker Metadata (Server)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        id: meta-server
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_SERVER }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: g3. Push Server Image to GHCR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: ${{ steps.meta-server.outputs.tags }}
          labels: ${{ steps.meta-server.outputs.labels }}

      - name: g4. Extract Docker Metadata (Client)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        id: meta-client
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_CLIENT }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: g5. Push Client Image to GHCR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: docker/build-push-action@v6
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          tags: ${{ steps.meta-client.outputs.tags }}
          labels: ${{ steps.meta-client.outputs.labels }}

      # (h1) Continuous Deployment: Backend
      - name: h1. Deploy Backend Web Service
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          RAW_HOOK="${{ secrets.BACKEND_DEPLOY_HOOK_URL || secrets.DEPLOY_HOOK_URL }}"
          BACKEND_HOOK=$(echo "$RAW_HOOK" | tr -d '\r\n[:space:]')
          if [ -n "$BACKEND_HOOK" ]; then
            echo "Backend deploy hook detected. Triggering backend deployment..."
            STATUS=$(curl -s -S -o /dev/null -w "%{http_code}" -X POST "$BACKEND_HOOK" || echo "curl_failed")
            echo "Backend deployment triggered with status: $STATUS"
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "201" ] || [ "$STATUS" = "202" ]; then
              echo "Backend deployment triggered successfully."
            else
              echo "NOTICE: Hook responded with status ($STATUS)."
            fi
          else
            echo "NOTICE: Neither BACKEND_DEPLOY_HOOK_URL nor DEPLOY_HOOK_URL is configured."
            echo "Add your backend deploy hook to GitHub Secrets to automate backend deployments."
          fi

      # (h2) Continuous Deployment: Frontend
      - name: h2. Deploy Frontend Web Service
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          RAW_HOOK="${{ secrets.FRONTEND_DEPLOY_HOOK_URL || secrets.DEPLOY_HOOK_URL }}"
          FRONTEND_HOOK=$(echo "$RAW_HOOK" | tr -d '\r\n[:space:]')
          if [ -n "$FRONTEND_HOOK" ]; then
            echo "Frontend deploy hook detected. Triggering frontend deployment..."
            STATUS=$(curl -s -S -o /dev/null -w "%{http_code}" -X POST "$FRONTEND_HOOK" || echo "curl_failed")
            echo "Frontend deployment triggered with status: $STATUS"
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "201" ] || [ "$STATUS" = "202" ]; then
              echo "Frontend deployment triggered successfully."
            else
              echo "NOTICE: Hook responded with status ($STATUS)."
            fi
          else
            echo "NOTICE: Neither FRONTEND_DEPLOY_HOOK_URL nor DEPLOY_HOOK_URL is configured."
            echo "Add your frontend deploy hook to GitHub Secrets to automate frontend deployments."
          fi
