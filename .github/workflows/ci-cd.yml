name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_SERVER: ${{ github.repository }}/server
  IMAGE_NAME_CLIENT: ${{ github.repository }}/client

jobs:
  # =========================================================================
  # Stage 1: Automated Testing & Application Build
  # =========================================================================
  test-and-build:
    name: "1. Automated Test & Build"
    runs-on: ubuntu-latest
    steps:
      # (a) Checkout code
      - name: a. Checkout Code
        uses: actions/checkout@v4

      # (b) Set up Runtimes
      - name: b1. Set up Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'server/requirements.txt'

      - name: b2. Set up Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'

      # (c) Install Dependencies with Caching
      - name: c1. Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt pytest pytest-asyncio

      - name: c2. Install Frontend Dependencies
        run: |
          npm --prefix client ci

      # (d) Run Automated Unit Tests
      - name: d1. Run Backend Automated Tests (pytest)
        run: |
          python -m pytest server -v

      - name: d2. Run Frontend Automated Tests (vitest)
        run: |
          npm --prefix client test

      # (e) Build Application
      - name: e. Build Frontend Production Bundle
        run: |
          npm --prefix client run build

  # =========================================================================
  # Stage 2: Docker Containerization, Registry Push & Continuous Deployment
  # =========================================================================
  containerize-and-deploy:
    name: "2. Containerize, Push & Deploy"
    needs: test-and-build
    runs-on: ubuntu-latest
    steps:
      # (a) Checkout code
      - name: a. Checkout Code
        uses: actions/checkout@v4

      # Set up Docker Buildx for multi-platform & cached builds
      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      # (f) Build Docker Images to prove they build (Runs on every Push and PR)
      - name: f1. Build Server Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          load: true
          tags: stocksense-server:test

      - name: f2. Build Client Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          file: ./client/Dockerfile
          load: true
          tags: stocksense-client:test

      # (g) Push Docker Images to GitHub Container Registry (ghcr.io)
      # Triggered only on push to main/master branches
      - name: g1. Log in to GitHub Container Registry
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: g2. Extract Docker Metadata (Server)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        id: meta-server
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_SERVER }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: g3. Push Server Image to GHCR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: ${{ steps.meta-server.outputs.tags }}
          labels: ${{ steps.meta-server.outputs.labels }}

      - name: g4. Extract Docker Metadata (Client)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        id: meta-client
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_CLIENT }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: g5. Push Client Image to GHCR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: docker/build-push-action@v6
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          tags: ${{ steps.meta-client.outputs.tags }}
          labels: ${{ steps.meta-client.outputs.labels }}

      # (h) Continuous Deployment Trigger
      - name: h. Trigger Application Deployment
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          echo "=========================================================="
          echo "Starting Continuous Deployment Stage..."
          echo "=========================================================="
          if [ -n "${{ secrets.DEPLOY_HOOK_URL }}" ]; then
            echo "Deploy webhook secret detected. Triggering live deployment..."
            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.DEPLOY_HOOK_URL }}")
            echo "Deployment webhook triggered with HTTP response code: $RESPONSE"
            if [ "$RESPONSE" -ge 200 ] && [ "$RESPONSE" -lt 400 ]; then
              echo "Deployment trigger succeeded."
            else
              echo "WARNING: Deploy webhook returned non-2xx status ($RESPONSE)."
            fi
          else
            echo "NOTICE: DEPLOY_HOOK_URL secret is not configured in repository."
            echo "To enable automated live deployments to Render / Railway / Cloud VM:"
            echo "  1. Create a deploy hook in your cloud host (e.g. Render Deploy Hook URL)."
            echo "  2. Add it to GitHub Repo Settings -> Secrets and variables -> Actions as 'DEPLOY_HOOK_URL'."
            echo "Skipping deployment step gracefully without failing the pipeline."
          fi
